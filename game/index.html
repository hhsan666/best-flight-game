<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skerrywind — Island Air Courier</title>
<meta name="description" content="Skerrywind: an original flight game. Fly the Saltrunner SR-2 courier over a seeded archipelago: takeoffs, ring runs, fuel-tight deliveries and graded landings.">
<link rel="stylesheet" href="styles/ui.css">
</head>
<body>
<canvas id="world-view" aria-label="Skerrywind 3D view: the Saltrunner over the Skerrywind Isles"></canvas>
<canvas id="hud-overlay" aria-hidden="true"></canvas>
<div id="screen-root"></div>
<div id="loading-card"><b>Building the Skerrywind Isles…</b><span>Five courier sorties and free flight in the Saltrunner: harbour rings, a canyon time trial, a fuel-tight crossing into a headwind, a crosswind landing in a squall and a dusk lantern run, with fuel burn, airframe damage and graded landings.</span></div>
